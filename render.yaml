services:
  - type: web
    name: nishabdha-preview
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: demo
      - key: VOICE_PRIMARY
        value: detectifai
      - key: VOICE_FALLBACK
        value: mock
      - key: STT_PROVIDER
        value: none
      - key: STT_FALLBACK
        value: none
      - key: LLM_PROVIDER
        value: none
      - key: NISHABHA_ALLOW_LOCAL_MODELS
        value: "false"
      - key: STAFF_API_KEY
        generateValue: true
      - key: AUDIT_HMAC_SECRET
        generateValue: true
